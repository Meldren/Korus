name: Korus
options:
  bundleIdPrefix: com.meldren
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Korus:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Korus
        CFBundleDisplayName: Korus
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.4"
        LSUIElement: false
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: "Korus needs microphone access to transcribe and translate your speech."
        NSAudioCaptureUsageDescription: "Korus needs system audio access to transcribe and translate audio playing on your Mac."
        NSSystemAudioCaptureUsageDescription: "Korus needs system audio access to transcribe and translate audio playing on your Mac."
    entitlements:
      path: Resources/Korus.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meldren.korus
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
