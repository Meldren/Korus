name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (latest available on the runner)
        run: |
          XCODE=$(ls -d /Applications/Xcode_* 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project Korus.xcodeproj \
            -scheme Korus \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            -skipPackagePluginValidation \
            build | xcbeautify || true
          test -d build/Build/Products/Release/Korus.app

      - name: Build DMG
        run: |
          APP=build/Build/Products/Release/Korus.app
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          create-dmg \
            --volname "Korus" \
            --window-size 540 360 \
            --icon-size 96 \
            --icon Korus.app 140 170 \
            --app-drop-link 400 170 \
            --hide-extension Korus.app \
            --no-internet-enable \
            Korus.dmg "$STAGE"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Korus.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
